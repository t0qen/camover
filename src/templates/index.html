<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="/static/style.css" />
        <link rel="manifest" href="/static/manifest.json">
        <!-- <meta name="viewport" content="width=device-width, initial-scale=1"> -->
    </head>

    <body>
        
        <!-- <p class="title">~ camover ~</p> -->
        
        <div class="stream">
            <img id="stream-id" src="/video_feed">
            <div class="global_actions">
                <div class="header">
                    <span id="battery-level">loading...</span>
                    <button class="button" id="fullscreen">
                        <img class="button-img" src="/static/data/fullscreen2.png">
                    </button>
                </div>
                <div class="buttons-bottom">
                    <div class="button-rot">
                        <div class="buttons-turn">
                            <button class="button" id="turn_left">
                                <img class="button-img" src="/static/data/turn_left.png">
                            </button>
                            <button class="button" id="turn_right">
                                <img class="button-img" src="/static/data/turn_right.png">
                            </button>
                        </div>
                        <div class="buttons-fast-turn">
                            <button class="button" id="fast_turn_left">
                                <img class="button-img" src="/static/data/fast_turn_left.png">
                            </button>
                            <button class="button" id="fast_turn_right">
                                <img class="button-img" src="/static/data/fast_turn_right.png">
                            </button> 
                        </div>
                    </div>
                    <div class="buttons-main">
                        <button class="button" id="buzzer">
                            <img class="button-img" src="/static/data/buzzer.png">
                        </button>   
                        <button class="button" id="backward">
                            <img class="button-img" src="/static/data/backward.png">
                        </button>
                        <button class="button" id="forward">
                            <img class="button-img" src="/static/data/forward.png">
                        </button>  
                    </div>
              
                </div>                   

            </div>

        </div>

        <script src="/static/app.js" charset="utf-8"></script>

    </body>
</html>
